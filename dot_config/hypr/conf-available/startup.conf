# Update configuration to match system theme
exec-once = ./scripts/set-theme.sh

# Export session environment to dbus-activated services
exec-once = dbus-update-activation-environment --all

# Status bar
exec-once = waybar

# Notification daemon
exec-once = mako

# Idle daemon
exec-once = hypridle

# Set theme
exec-once = $HOME/.config/hypr/scripts/set-theme.sh
