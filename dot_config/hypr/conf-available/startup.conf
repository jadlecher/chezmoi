# Export session environment to dbus-activated services
exec-once = dbus-update-activation-environment --all

# Status bar
exec-once = sh -c 'theme_dir="$HOME/.config/waybar/themes"; style="$HOME/.config/waybar/style-current.css"; mkdir -p "$theme_dir"; [[ -e "$theme_dir/current.css" ]] || ln -s "mocha.css" "$theme_dir/current.css"; [[ -f "$style" ]] || printf "@import \"./themes/current.css\";\n@import \"./style.css\";\n" > "$style"; waybar -s "$style"'

# Notification daemon
exec-once = mako

# Idle daemon
exec-once = hypridle

# Set theme
exec-once = $HOME/.config/hypr/scripts/set-theme.sh

# Keep laptop display state in sync with lid/external outputs.
exec-once = $HOME/.config/hypr/scripts/clamshell-watch.sh
exec-once = $HOME/.config/hypr/scripts/clamshell-mode.sh --reason startup --settle-seconds 10 --retry-interval 0.5
