$mod = SUPER

# Define applications

$terminal = kitty
$menu = bemenu-run

# Launch and kill applications
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod SHIFT, C, killactive,

# Window behavior
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo, # dwindle
bind = $mod, F, fullscreen

# Move window focus
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move window
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Open a terminal in a horizontal or vertical split
bind = $mod, minus, layoutmsg, preselect d
bind = $mod, minus, exec, $terminal
bind = $mod SHIFT, backslash, layoutmsg, preselect r
bind = $mod SHIFT, backslash, exec, $terminal

# Select the split direction for the next tiled window
bind = $mod CTRL, minus, layoutmsg, preselect d
bind = $mod CTRL SHIFT, backslash, layoutmsg, preselect r

# Window mode
bind = $mod, W, submap, window
submap = window
bind = , d, killactive,
bind = , d, submap, reset
bind = , m, fullscreen,
bind = , m, submap, reset
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset
submap = reset

# Switch workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, period, workspace, e+1
bind = $mod, comma, workspace, e-1

# Move windows to workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# light / dark theme switching
$set_theme = $HOME/.local/bin/set-theme
bind = $mod CTRL, l, exec, loginctl lock-session
bind = $mod CTRL SHIFT, l, exec, $set_theme light
bind = $mod CTRL SHIFT, d, exec, $set_theme dark

# Resize mode
bind = $mod, R, submap, resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , w, resizeactive, exact 65% 100%
bind = , w, submap, reset
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset
submap = reset

# screenshots
bind = $mod SHIFT, s, submap, screenshot
submap = screenshot
bind = , r, exec, sh -lc '$HOME/.config/hypr/scripts/screenshot.sh region; hyprctl dispatch submap reset'
bind = , w, exec, sh -lc '$HOME/.config/hypr/scripts/screenshot.sh window; hyprctl dispatch submap reset'
bind = , o, exec, sh -lc '$HOME/.config/hypr/scripts/screenshot.sh output; hyprctl dispatch submap reset'
bind = , c, exec, sh -lc '$HOME/.config/hypr/scripts/screenshot.sh region-clipboard; hyprctl dispatch submap reset'
bind = , a, exec, sh -lc '$HOME/.config/hypr/scripts/screenshot.sh annotate-region; hyprctl dispatch submap reset'
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset
submap = reset

# System mode
bind = $mod SHIFT, E, submap, system
submap = system
bind = , e, exit # exit hyprland
bind = , l, exec, loginctl lock-session
bind = , r, submap, system_reboot_confirm
bind = , s, submap, system_poweroff_confirm
bind = , n, submap, reset
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset

submap = system_reboot_confirm
bind = , y, exec, loginctl reboot -i
bind = , n, submap, reset
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset

submap = system_poweroff_confirm
bind = , y, exec, loginctl poweroff -i
bind = , n, submap, reset
bind = , escape, submap, reset
bind = CTRL, bracketleft, submap, reset

submap = reset
